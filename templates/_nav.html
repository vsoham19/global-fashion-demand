{% macro navbar(active) %}
<header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
  <div class="container-main py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center shadow-sm">
        <span class="material-symbols-outlined text-white text-[20px]">analytics</span>
      </div>
      <div class="flex flex-col">
        <span class="text-base font-bold text-slate-900 tracking-tight leading-tight">FashionDemand AI</span>
        <span class="text-[11px] text-slate-500 leading-tight">PySpark Analytics Dashboard</span>
      </div>
    </div>
    <nav class="hidden md:flex items-center gap-1 bg-slate-100 rounded-xl p-1">
      <a href="/" class="px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-1.5 {{ 'bg-white text-slate-900 shadow-sm' if active == 'overview' else 'text-slate-500 hover:text-slate-700' }}">
        <span class="material-symbols-outlined text-[16px]">dashboard</span>Overview
      </a>
      <a href="/inventory" class="px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-1.5 {{ 'bg-white text-slate-900 shadow-sm' if active == 'inventory' else 'text-slate-500 hover:text-slate-700' }}">
        <span class="material-symbols-outlined text-[16px]">inventory_2</span>Inventory
      </a>
      <a href="/insights" class="px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-1.5 {{ 'bg-white text-slate-900 shadow-sm' if active == 'insights' else 'text-slate-500 hover:text-slate-700' }}">
        <span class="material-symbols-outlined text-[16px]">lightbulb</span>Insights
      </a>
      <a href="/models" class="px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-1.5 {{ 'bg-white text-slate-900 shadow-sm' if active == 'models' else 'text-slate-500 hover:text-slate-700' }}">
        <span class="material-symbols-outlined text-[16px]">model_training</span>Models
      </a>
    </nav>
    <div class="flex items-center gap-2">
      <div class="hidden lg:flex items-center gap-1.5 px-3 py-2 rounded-lg bg-slate-100 text-xs text-slate-500">
        <span class="material-symbols-outlined text-[14px]">calendar_today</span>
        <span>Jan 2023 - Mar 2025</span>
      </div>
      <div class="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-emerald-50 text-emerald-700 text-xs font-medium">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Live</span>
      </div>
    </div>
  </div>
</header>
{% endmacro %}
